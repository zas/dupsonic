name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Fail fast if the crate version and the pushed tag disagree. This guards
  # against tagging a release before bumping Cargo.toml (the binaries embed
  # CARGO_PKG_VERSION, so a mismatch ships a wrong `--version`). Gates the
  # build matrix below via `needs`, so a mismatch produces no artifacts and
  # no GitHub Release.
  verify-version:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cargo.toml version == tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag version:   $tag"
          echo "crate version: $crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::Cargo.toml version ($crate) does not match tag ($tag). Bump Cargo.toml before tagging." >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: dupsonic-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: dupsonic-linux-aarch64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: dupsonic-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: dupsonic-macos-aarch64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: dupsonic-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      # Pin to the same version as rust-toolchain.toml so the target std we
      # install below is added to the toolchain that actually runs the build.
      # (With a floating `@stable` here but a pinned rust-toolchain.toml, the
      # cross-target std could be installed against a different toolchain than
      # the one cargo selects, causing "can't find crate for std".)
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      # Belt-and-suspenders: ensure the target's std is present for the pinned
      # toolchain before cross-compiling.
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} dupsonic

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.archive }} dupsonic.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
